name: Official Browser Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/official-browser-recovery.yml"

permissions:
  contents: write

concurrency:
  group: emirtv-playlist-maintenance
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recheck current unknown channels
        id: targets
        run: |
          python health_check.py
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          rows = json.loads(Path("deep_targets.json").read_text(encoding="utf-8"))
          unknown = [row for row in rows if row.get("health_status") == "unknown"]
          Path("unknown_targets.json").write_text(
              json.dumps(unknown, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"count={len(unknown)}")
          print("names=" + ",".join(row.get("name", "") for row in unknown))
          PY

      - name: Refresh official HTML candidates
        if: steps.targets.outputs.count != '0'
        run: python official_sources.py

      - name: Install browser
        if: steps.targets.outputs.count != '0'
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Scan official JavaScript players
        if: steps.targets.outputs.count != '0'
        env:
          BROWSER_FORCE_NAMES: ${{ steps.targets.outputs.names }}
        run: python browser_discover.py

      - name: Apply only verified official or safe alternatives
        if: steps.targets.outputs.count != '0'
        run: |
          python targeted_repair.py \
            --targets unknown_targets.json \
            --report official_browser_repair.json

      - name: Post-check repaired playlist
        run: |
          python health_check.py \
            --report post_health.json \
            --targets post_repair_targets.json \
            --deep-targets post_deep_targets.json

      - name: Write summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          before = json.loads(Path("unknown_targets.json").read_text(encoding="utf-8"))
          after = json.loads(Path("post_health.json").read_text(encoding="utf-8"))
          repair = {}
          p = Path("official_browser_repair.json")
          if p.exists():
              repair = json.loads(p.read_text(encoding="utf-8"))

          print("# Official browser recovery")
          print()
          print(f"Unknown targets before: **{len(before)}**")
          print(f"Verified replacements: **{repair.get('repaired', 0)}**")
          print(f"Post-check unknown/restricted: **{after.get('deep_probe_targets', 0)}**")
          print()
          for row in repair.get("replacements", []):
              print(f"- {row.get('name')}: verified replacement")
          PY

      - name: Upload recovery report
        uses: actions/upload-artifact@v4
        with:
          name: official-browser-recovery-${{ github.run_id }}
          path: |
            unknown_targets.json
            official_discovered.m3u
            official_stats.json
            browser_discovered.m3u
            browser_stats.json
            official_browser_repair.json
            post_health.json
            post_deep_targets.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit recovered streams and official snapshots
        run: |
          git config user.name "emirtv-bot"
          git config user.email "actions@users.noreply.github.com"

          git add tr.m3u official_discovered.m3u official_stats.json \
            browser_discovered.m3u browser_stats.json

          if git diff --cached --quiet; then
            echo "No persistent changes"
            exit 0
          fi

          git commit -m "bot: recover streams from official players"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
