name: Update M3U

on:
  workflow_dispatch:
  push:
    paths:
      - "checker.py"
      - "hls_validator.py"
      - "discover.py"
      - "official_sources.py"
      - "turkuvaz_discover.py"
      - "browser_discover.py"
      - "discover_queries.txt"
      - "sources.txt"
      - "priority_sources.m3u"
      - "channel_policy.py"
      - "category_engine.py"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-m3u-v2
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover official live streams
        run: |
          timeout --signal=TERM 90s python official_sources.py || {
            echo "Official source scan timed out/failed; continuing with last committed snapshot"
            exit 0
          }

      - name: Discover Turkuvaz player API streams
        run: |
          timeout --signal=TERM 75s python turkuvaz_discover.py || {
            echo "Turkuvaz discovery timed out/failed; continuing with last committed snapshot"
            exit 0
          }

      - name: Install Playwright browser fallback
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Browser fallback for official live streams
        run: |
          timeout --signal=TERM 7m python browser_discover.py || {
            echo "Browser fallback timed out/failed; continuing with last committed snapshot"
            exit 0
          }

      - name: Discover public M3U8 candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python discover.py

      - name: Validate streams and build playlists
        run: python checker.py

      - name: Commit changes
        run: |
          git config user.name "emirtv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add             a.m3u r.m3u u.m3u all.m3u             stats.json validation.json missing_channels.json             official_discovered.m3u official_stats.json             turkuvaz_discovered.m3u turkuvaz_stats.json             browser_discovered.m3u browser_stats.json             discovered.m3u discovery_stats.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "bot: validate HLS streams and update playlists"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

