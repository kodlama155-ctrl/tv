name: Update M3U

on:
  workflow_dispatch:
  push:
    paths:
      - "checker.py"
      - "discover.py"
      - "discover_queries.txt"
      - "sources.txt"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-m3u
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover public M3U8 candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python discover.py

      - name: Build playlist
        run: python checker.py

      - name: Commit changes
        run: |
          git config user.name "emirtv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add a.m3u stats.json discovered.m3u discovery_stats.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "bot: discover and update playlist"
            git push
          fi
