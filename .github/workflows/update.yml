name: Update M3U

on:
  workflow_dispatch:
  push:
    paths:
      - "checker.py"
      - "sources.txt"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-m3u
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        run: python checker.py

      - name: Commit changes
        run: |
          git config user.name "emirtv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add a.m3u stats.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "bot: update playlist"
            git push
          fi
