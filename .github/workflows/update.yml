name: Update M3U

on:
  workflow_dispatch:
  push:
    paths:
      - "checker.py"
      - "hls_validator.py"
      - "discover.py"
      - "missing_discover.py"
      - "official_sources.py"
      - "turkuvaz_discover.py"
      - "browser_discover.py"
      - "browser_needed.py"
      - "discover_queries.txt"
      - "sources.txt"
      - "priority_sources.m3u"
      - "priority_refresh.py"
      - "channel_policy.py"
      - "channel_catalog.py"
      - "name_engine.py"
      - "category_engine.py"
      - "fast_rebuild.py"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-m3u-v3
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect update mode
        id: update_mode
        shell: bash
        run: |
          mode="full"

          if [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            changed="$(git diff --name-only "$before" "$after" || true)"

            echo "Changed files:"
            printf '%s\n' "$changed"

            if [ -n "$changed" ]; then
              non_fast="$(printf '%s\n' "$changed" | grep -Ev '^(channel_catalog\.py|category_engine\.py|fast_rebuild\.py)$' || true)"
              if [ -z "$non_fast" ]; then
                mode="fast"
              else
                non_validate="$(printf '%s\n' "$changed" | grep -Ev '^priority_sources\.m3u$' || true)"
                if [ -z "$non_validate" ]; then
                  mode="validate"
                fi
              fi
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Update mode: $mode"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fast category rebuild
        if: steps.update_mode.outputs.mode == 'fast'
        run: python fast_rebuild.py

      - name: Discover official live streams
        if: steps.update_mode.outputs.mode == 'full'
        run: |
          timeout --signal=TERM 90s python official_sources.py || {
            echo "Official source scan timed out/failed; continuing with last committed snapshot"
            exit 0
          }

      - name: Discover Turkuvaz player API streams
        if: steps.update_mode.outputs.mode == 'full'
        run: |
          timeout --signal=TERM 75s python turkuvaz_discover.py || {
            echo "Turkuvaz discovery timed out/failed; continuing with last committed snapshot"
            exit 0
          }

      - name: Check browser fallback need
        if: steps.update_mode.outputs.mode == 'full'
        id: browser_need
        run: echo "mode=$(python browser_needed.py)" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browser fallback
        if: steps.update_mode.outputs.mode == 'full' && github.event_name != 'push' && steps.browser_need.outputs.mode == 'run'
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Browser fallback for official live streams
        if: steps.update_mode.outputs.mode == 'full' && github.event_name != 'push' && steps.browser_need.outputs.mode == 'run'
        run: |
          timeout --signal=TERM 7m python browser_discover.py || {
            echo "Browser fallback timed out/failed; continuing with last committed snapshot"
            exit 0
          }

      - name: Reuse fresh browser fallback snapshot
        if: steps.update_mode.outputs.mode == 'full' && steps.browser_need.outputs.mode == 'reuse'
        run: echo "Browser fallback snapshot is fresh; reusing committed result"

      - name: Clear stale browser fallback when fully resolved
        if: steps.update_mode.outputs.mode == 'full' && steps.browser_need.outputs.mode == 'clear'
        run: |
          printf '#EXTM3U\n' > browser_discovered.m3u
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          Path("browser_stats.json").write_text(
              json.dumps({
                  "updated_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
                  "fallback_targets": 0,
                  "pages_scanned": 0,
                  "pages_with_candidates": 0,
                  "raw_candidates": 0,
                  "accepted_unique_candidates": 0,
                  "probe_statuses": {},
                  "sources": [],
                  "note": "Browser fallback cleared; all configured official targets resolved earlier."
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Discover public M3U8 candidates
        if: steps.update_mode.outputs.mode == 'full'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python discover.py

      - name: Target missing catalog channels
        if: steps.update_mode.outputs.mode == 'full'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python missing_discover.py

      - name: Validate priority source delta
        if: steps.update_mode.outputs.mode == 'validate'
        env:
          PRIORITY_BEFORE_SHA: ${{ github.event.before }}
        run: python priority_refresh.py

      - name: Validate streams and build playlists
        if: steps.update_mode.outputs.mode == 'full'
        run: python checker.py

      - name: Commit changes
        run: |
          git config user.name "emirtv-bot"
          git config user.email "actions@users.noreply.github.com"

          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          trigger_sha="${{ github.sha }}"
          if [ "$remote_sha" != "$trigger_sha" ]; then
            echo "main advanced during this run; skipping stale output commit"
            echo "trigger=$trigger_sha remote=$remote_sha"
            exit 0
          fi

          if [ "${{ steps.update_mode.outputs.mode }}" = "fast" ]; then
            git add tr.m3u stats.json
          elif [ "${{ steps.update_mode.outputs.mode }}" = "validate" ]; then
            git add tr.m3u priority_validation.json
          else
            git add a.m3u r.m3u u.m3u all.m3u tr.m3u \
              stats.json validation.json missing_channels.json \
              official_discovered.m3u official_stats.json \
              turkuvaz_discovered.m3u turkuvaz_stats.json \
              browser_discovered.m3u browser_stats.json \
              discovered.m3u discovery_stats.json \
              missing_discovered.m3u missing_discovery_stats.json
          fi

          if git diff --cached --quiet; then
            echo "No changes"
          else
            if [ "${{ steps.update_mode.outputs.mode }}" = "fast" ]; then
              git commit -m "bot: fast rebuild channel categories"
            elif [ "${{ steps.update_mode.outputs.mode }}" = "validate" ]; then
              git commit -m "bot: validate priority stream changes"
            else
              git commit -m "bot: validate HLS streams and update playlists"
            fi
            git push origin HEAD:main
          fi
