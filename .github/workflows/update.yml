name: Update M3U

on:
  workflow_dispatch:
  push:
    paths:
      - "checker.py"
      - "hls_validator.py"
      - "discover.py"
      - "discover_queries.txt"
      - "sources.txt"
      - "priority_sources.m3u"
      - "channel_policy.py"
      - "tr_recheck.py"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-m3u
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover public M3U8 candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python discover.py

      - name: Validate streams and build playlists
        run: python checker.py

      - name: Commit changes
        run: |
          git config user.name "emirtv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add             a.m3u r.m3u u.m3u all.m3u             stats.json validation.json missing_channels.json             discovered.m3u discovery_stats.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "bot: validate HLS streams and update playlists"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  tr-recheck:
    name: Recheck non-verified streams from Türkiye
    needs: update
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'kodlama155-ctrl') }}
    runs-on: [self-hosted, Windows, X64, tr]
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check local Python
        shell: pwsh
        run: |
          if (Get-Command python -ErrorAction SilentlyContinue) {
            python --version
          } elseif (Get-Command py -ErrorAction SilentlyContinue) {
            py -3 --version
          } else {
            throw "Python is not installed or not available in PATH on tv-runner-tr."
          }

      - name: Recheck non-verified streams from Türkiye
        shell: pwsh
        run: |
          git pull --ff-only origin main

          if (Get-Command python -ErrorAction SilentlyContinue) {
            python tr_recheck.py
          } else {
            py -3 tr_recheck.py
          }

      - name: Commit Türkiye verification results
        shell: pwsh
        run: |
          git config user.name "emirtv-tr-runner"
          git config user.email "actions@users.noreply.github.com"
          git add a.m3u r.m3u u.m3u all.m3u stats.json validation.json missing_channels.json

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No Türkiye verification changes"
            exit 0
          }

          git commit -m "bot: verify restricted streams from Türkiye"
          git pull --rebase origin main
          git push origin HEAD:main
