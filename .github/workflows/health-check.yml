name: Smart Stream Health

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    paths:
      - "health_check.py"
      - "apply_fallbacks.py"
      - "prune_unverified.py"
      - "targeted_discover.py"
      - "targeted_repair.py"
      - "deep_probe.py"
      - "hls_validator.py"
      - ".github/workflows/health-check.yml"

permissions:
  contents: write

concurrency:
  group: emirtv-playlist-writes
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check current tr.m3u only
        id: health
        run: |
          python health_check.py
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          targets = json.loads(Path("repair_targets.json").read_text(encoding="utf-8"))
          deep_targets = json.loads(Path("deep_targets.json").read_text(encoding="utf-8"))
          fallback_repairs = json.loads(Path("fallback_repairs.json").read_text(encoding="utf-8"))
          print(f"repair_count={len(targets)}")
          print(f"deep_count={len(deep_targets)}")
          print(f"fallback_count={len(fallback_repairs)}")
          PY

      - name: Deep-check only unknown or restricted channels
        if: steps.health.outputs.deep_count != '0'
        run: python deep_probe.py --targets deep_targets.json --output deep_probe.json

      - name: Build unresolved unknown target list
        if: steps.health.outputs.deep_count != '0'
        id: unknowns
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          deep = json.loads(Path("deep_probe.json").read_text(encoding="utf-8"))
          targets = []
          for row in deep.get("results", []):
              if row.get("final_current_status") != "unknown":
                  continue
              targets.append({
                  "name": row.get("name"),
                  "channel_key": row.get("channel_key"),
                  "meta": "",
                  "old_url": row.get("url"),
              })

          Path("unknown_targets.json").write_text(
              json.dumps(targets, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"unknown_count={len(targets)}\n")
          print(json.dumps({
              "unknown_count": len(targets),
              "names": [row["name"] for row in targets],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Search only unresolved unknown channels
        if: steps.unknowns.outputs.unknown_count != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python targeted_discover.py \
            --targets unknown_targets.json \
            --output unknown_discovered.m3u \
            --stats unknown_discovery_stats.json

      - name: Replace unknown channels only with verified alternatives
        if: steps.unknowns.outputs.unknown_count != '0'
        run: |
          python targeted_repair.py \
            --targets unknown_targets.json \
            --report unknown_repair_result.json

      - name: Apply ready verified fallbacks
        run: python apply_fallbacks.py

      - name: Remove unresolved unknown channels
        if: steps.unknowns.outputs.unknown_count != '0'
        run: python prune_unverified.py

      - name: Search only confirmed dead channels
        if: steps.health.outputs.repair_count != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python targeted_discover.py

      - name: Repair only confirmed dead channels
        if: steps.health.outputs.repair_count != '0'
        run: python targeted_repair.py

      - name: Write summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          health = json.loads(Path("health_status.json").read_text(encoding="utf-8"))
          print("# EmirTV stream health")
          print()
          print(f"Current links checked: **{health['channels_checked']}**")
          counts = health.get("status_counts", {})
          print(
              "Status: "
              f"verified **{counts.get('verified', 0)}**, "
              f"restricted **{counts.get('restricted', 0)}**, "
              f"unknown **{counts.get('unknown', 0)}**, "
              f"dead **{counts.get('dead', 0)}**"
          )
          print(f"Confirmed dead after retry: **{health['confirmed_dead']}**")
          print(f"Deep-test targets: **{health.get('deep_probe_targets', 0)}**")
          deep = Path("deep_probe.json")
          if deep.exists():
              data = json.loads(deep.read_text(encoding="utf-8"))
              print(
                  f"Deep-test current links verified: **"
                  f"{data.get('current_links_verified_after_deep', 0)} / "
                  f"{data.get('channels_checked', 0)}**"
              )
              print(
                  f"Verified alternatives found: **"
                  f"{data.get('verified_alternative_available_for_unverified', 0)}**"
              )
          unknown_repair = Path("unknown_repair_result.json")
          if unknown_repair.exists():
              data = json.loads(unknown_repair.read_text(encoding="utf-8"))
              print(f"Unknown-channel verified replacements: **{data.get('repaired', 0)}**")
          fallback = Path("fallback_apply_result.json")
          if fallback.exists():
              data = json.loads(fallback.read_text(encoding="utf-8"))
              print(f"Ready fallback replacements: **{data.get('applied', 0)}**")
          pruned = Path("prune_unverified_result.json")
          if pruned.exists():
              data = json.loads(pruned.read_text(encoding="utf-8"))
              print(f"Unresolved unknown channels removed: **{data.get('removed', 0)}**")
          repair = Path("repair_result.json")
          if repair.exists():
              data = json.loads(repair.read_text(encoding="utf-8"))
              print(f"Dead-channel repairs applied: **{data.get('repaired', 0)}**")
          PY

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: stream-health-${{ github.run_id }}
          path: |
            health_status.json
            repair_targets.json
            deep_targets.json
            deep_probe.json
            unknown_targets.json
            unknown_discovered.m3u
            unknown_discovery_stats.json
            unknown_repair_result.json
            repair_discovered.m3u
            repair_discovery_stats.json
            repair_result.json
            fallback_repairs.json
            fallback_apply_result.json
            prune_unverified_result.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit verified targeted replacements
        if: steps.health.outputs.repair_count != '0' || steps.unknowns.outputs.unknown_count != '0' || steps.health.outputs.fallback_count != '0'
        run: |
          git config user.name "emirtv-bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet -- tr.m3u; then
            echo "No verified targeted replacement found; playlist unchanged"
            exit 0
          fi

          git stash push -m "stream-health-tr" -- tr.m3u
          git fetch origin main
          git rebase origin/main
          git stash pop
          git add tr.m3u
          git commit -m "bot: repair verified stream links"
          git push origin HEAD:main
