name: One-off credential URL probe

on:
  push:
    paths:
      - "credential_probe.py"
      - ".github/workflows/credential_probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe public repo URL without exposing credentials
        run: python credential_probe.py

      - name: Commit redacted result
        run: |
          git config user.name "emirtv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add credential_probe_result.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "test: record redacted credential URL probe"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
